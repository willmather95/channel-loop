[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "channel-loop"
version = "0.1.0"
description = "A paid-channel loop that reads the warehouse, picks one change, makes it through guardrails, measures it with a holdout, and updates its beliefs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Will Mather" }]
# The two sibling repos are installed from requirements.txt (pinned git URLs) or
# requirements-local.txt (editable path overrides for dev). See README "Install".
dependencies = [
  "ads-guardrail-agent>=0.1",
  "landing-page-lab>=0.1",
  "duckdb>=1.0",
  "numpy>=1.26",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
channel-loop = "channel_loop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: many-seed simulation tests"]
